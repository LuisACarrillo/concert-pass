apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-checkout
  labels:
    app: ticket-checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-checkout
  template:
    metadata:
      labels:
        app: ticket-checkout
    spec:
      containers:
        - name: ticket-checkout
          image: __ECR_REGISTRY__/ticket-checkout:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-checkout
spec:
  type: ClusterIP
  selector:
    app: ticket-checkout
  ports:
    - name: http
      port: 8000
      targetPort: http
