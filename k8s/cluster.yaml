apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: concertpass
  region: __AWS_REGION__

iam:
  withOIDC: false
  serviceRoleARN: arn:aws:iam::__ACCOUNT_ID__:role/LabRole

autoModeConfig:
  enabled: false

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    # Subred pública: el NodePort de ticket-api tiene que ser alcanzable desde fuera.
    privateNetworking: false
    iam:
      instanceRoleARN: arn:aws:iam::__ACCOUNT_ID__:role/LabRole
