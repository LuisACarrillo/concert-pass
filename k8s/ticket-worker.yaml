
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-worker
  labels:
    app: ticket-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-worker
  template:
    metadata:
      labels:
        app: ticket-worker
    spec:
      containers:
        - name: ticket-worker
          image: __ECR_REGISTRY__/ticket-worker:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: concertpass-config
            - secretRef:
                name: concertpass-rds
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
