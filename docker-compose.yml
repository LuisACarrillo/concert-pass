# Corre los 3 servicios localmente contra la infraestructura real de AWS.
# Requiere el .env que genera scripts/setup.sh.
#   docker compose up --build -d
#   docker compose up -d --scale ticket-worker=3
#
# Credenciales de AWS: se monta ~/.aws del usuario que corre docker compose (en WSL, el
# ~/.aws de Ubuntu) en solo lectura. También se pasan las variables AWS_* de la terminal
# si están definidas (formato de lista: solo se pasan las que existan en la terminal).

x-aws: &aws
  env_file: .env
  volumes:
    - ~/.aws:/root/.aws:ro

# GET /health con la librería estándar (las imágenes no traen curl)
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  ticket-api:
    <<: *aws
    build: ./ticket-api
    image: ticket-api:local
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_PROFILE
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    restart: unless-stopped

  ticket-checkout:
    build: ./ticket-checkout
    image: ticket-checkout:local
    environment:
      - CHECKOUT_DELAY_MS=${CHECKOUT_DELAY_MS:-0}
    ports:
      - "8000:8000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    restart: unless-stopped

  # Sin puertos publicados ni container_name para poder usar --scale ticket-worker=N
  ticket-worker:
    <<: *aws
    build: ./ticket-worker
    image: ticket-worker:local
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_PROFILE
      - CHECKOUT_URL=http://ticket-checkout:8000
    depends_on:
      ticket-checkout:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
    restart: unless-stopped
